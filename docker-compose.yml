services: 
  api: 
    build: ./api
    ports:
      - 3001:3001
    command: npm run prod
    restart: always
    environment:
      - CLIENT_URL=http://localhost:4173
      - SERVER_PORT=3001

  client:
    build: ./client
    command: npm run preview
    restart: always
    env_file:
      - ./client/.env
    ports:
      - 4173:4173